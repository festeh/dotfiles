[symlinks.hyprland_scripts]
target = "hyprland/scripts"
name = "~/.config/hypr/scripts"

[symlinks.kitty]
target = "kitty"
name = "~/.config/kitty"

[symlinks.uwsm]
target = "uwsm"
name = "~/.config/uwsm"

[symlinks.ags]
target = "ags"
name = "~/.config/ags"

[symlinks.gammastep]
target = "gammastep"
name = "~/.config/gammastep"

[symlinks.waybar]
target = "waybar"
name = "~/.config/waybar"

[symlinks.zathura]
target = "zathura"
name = "~/.config/zathura"

[symlinks.zed]
target = "zed"
name = "~/.config/zed"

[symlinks.rofi]
target = "rofi"
name = "~/.config/rofi"

[symlinks.aiderconfig]
target = "aider/.aider.conf.yml"
name = "~/.aider.conf.yml"

[symlinks.aidermodel]
target = "aider/.aider.model.settings.yml"
name = "~/.aider.model.settings.yml"

[symlinks.switcher]
target = "switcher"
name = "~/.config/switcher"

[symlinks.screenshot_desktop]
target = "autostart/screenshot.desktop"
name = "~/.local/share/applications/screenshot.desktop"

[symlinks.workspace_name_script]
target = "scripts/workspace-name-from-kitty.sh"
name = "~/.local/bin/workspace-name-from-kitty"

[symlinks.generate_kitty_session]
target = "kitty/generate-kitty-session.js"
name = "~/.local/bin/generate-kitty-session"

[symlinks.rofi_books]
target = "scripts/rofi-books.py"
name = "~/.local/bin/rofi-books"

[symlinks.book_desktop]
target = "scripts/book-desktop.py"
name = "~/.local/bin/book-desktop"

[symlinks.book_desktop_hyprland]
target = "books/hyprland.lua"
name = "~/.config/book-desktop/hyprland.lua"

[symlinks.book_desktop_launcher]
target = "books/reading-desktop.desktop"
name = "~/.local/share/applications/reading-desktop.desktop"

[symlinks.book_desktop_stop_launcher]
target = "books/reading-desktop-stop.desktop"
name = "~/.local/share/applications/reading-desktop-stop.desktop"

[templates.hyprland]
target = "hyprland/hyprland_template.lua"
name = "~/.config/hypr/hyprland.lua"
SCALING = "1"
USER = "dima"
GTK_THEME = "catppuccin-mocha-mauve-standard+default"
BIND_WORKSPACES_TO_EDP1 = "true"

[templates.ags_daemon]
target = "systemd/ags_template.service"
name = "~/.config/systemd/user/ags.service"
GTK_THEME = "catppuccin-mocha-mauve-standard+default"
AGS_PATH = "/home/dima/.local/bin"

[symlinks.mise]
target = "mise/config.toml"
name = "~/.config/mise/config.toml"
