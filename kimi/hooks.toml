# AGS status widget hooks (dotfiles/kimi/hooks/ags-status.py)
[[hooks]]
event = "SessionStart"
command = "python3 ~/dotfiles/kimi/hooks/ags-status.py"
timeout = 5

[[hooks]]
event = "SessionEnd"
command = "python3 ~/dotfiles/kimi/hooks/ags-status.py"
timeout = 5

[[hooks]]
event = "UserPromptSubmit"
command = "python3 ~/dotfiles/kimi/hooks/ags-status.py"
timeout = 5

