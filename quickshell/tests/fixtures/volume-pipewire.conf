context.properties = { core.daemon = true core.name = pipewire-0 }
context.spa-libs = { support.* = support/libspa-support audio.convert.* = audioconvert/libspa-audioconvert audio.adapt = audioconvert/libspa-audioconvert }
context.modules = [
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-metadata }
 { name = libpipewire-module-spa-node-factory }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-adapter }
 { name = libpipewire-module-access args = { access.force = unrestricted } }
]
context.objects = [
 { factory = metadata args = { metadata.name = default } }
 { factory = adapter args = { factory.name = support.null-audio-sink node.name = volume-test-a node.description = "Test speakers" media.class = Audio/Sink audio.position = [ FL FR ] adapter.auto-port-config = { mode = dsp } } }
 { factory = adapter args = { factory.name = support.null-audio-sink node.name = volume-test-b node.description = "Test headphones" media.class = Audio/Sink audio.position = [ FL FR ] adapter.auto-port-config = { mode = dsp } } }
]
